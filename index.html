<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Случайные комиксы</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background: #1a1a2e; color: #fff; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        header h1 { text-align: center; margin-bottom: 10px; color: #e94560; }
        header p { text-align: center; margin-bottom: 30px; color: #ccc; }
        .comic-display { display: flex; flex-direction: column; align-items: center; margin-bottom: 30px; }
        .comic-preview { width: 100%; max-width: 600px; border-radius: 10px; overflow: hidden; margin-bottom: 20px; border: 3px solid #0f3460; }
        .comic-preview img { width: 100%; height: auto; display: block; }
        .comic-info { text-align: center; margin-bottom: 20px; }
        .buttons { display: flex; gap: 20px; margin-bottom: 20px; }
        button { padding: 12px 25px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .like { background: #4CAF50; color: white; }
        .dislike { background: #f44336; color: white; }
        .view { background: #2196F3; color: white; }
        button:hover { opacity: 0.8; }
        .history, .recommended { background: #162447; padding: 20px; border-radius: 10px; margin-top: 30px; }
        h2 { margin-bottom: 15px; color: #e94560; border-bottom: 2px solid #e94560; padding-bottom: 5px; }
        .comic-list { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 15px; }
        .comic-item { background: #0f3460; border-radius: 8px; padding: 10px; width: 180px; text-align: center; cursor: pointer; transition: transform 0.3s; }
        .comic-item:hover { transform: scale(1.05); }
        .comic-item img { width: 100%; height: 200px; object-fit: cover; border-radius: 5px; }
        .comic-item p { margin-top: 8px; font-size: 14px; }
        .loading { text-align: center; font-size: 18px; margin: 20px; }
        .error { color: #f44336; text-align: center; margin: 10px 0; }
        @media (max-width: 768px) {
            .buttons { flex-direction: column; align-items: center; }
            button { width: 200px; }
            .comic-list { justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎴 Случайные комиксы</h1>
            <p>Лайкайте, дизайкайте, читайте. Система учится на ваших оценках.</p>
        </header>

        <main>
            <div class="comic-display">
                <div class="comic-preview">
                    <img id="current-comic-img" src="" alt="Превью комикса" />
                </div>
                <div class="comic-info">
                    <h2 id="comic-title">Загрузка...</h2>
                    <p id="comic-desc"></p>
                    <p id="comic-tags"></p>
                </div>
                <div class="buttons">
                    <button class="dislike" onclick="rateComic('dislike')">👎 Дизлайк</button>
                    <button class="view" onclick="viewComic()">📖 Читать</button>
                    <button class="like" onclick="rateComic('like')">👍 Лайк</button>
                </div>
                <div id="error-message" class="error"></div>
            </div>

            <div class="history">
                <h2>📚 История лайков</h2>
                <div id="liked-comics" class="comic-list">
                    <!-- Лайкнутые комиксы появятся здесь -->
                </div>
            </div>

            <div class="recommended">
                <h2>🔥 Рекомендуемые (на основе ваших лайков)</h2>
                <div id="recommended-comics" class="comic-list">
                    <!-- Рекомендации появятся здесь -->
                </div>
            </div>
        </main>
    </div>

    <script>
        // База комиксов с реальными данными с hent.cool
        const comics = [
            { 
                id: 1, 
                title: "Лунный свет", 
                desc: "Романтическая история под луной", 
                img: "https://ru.hent.cool/wp-content/uploads/2024/06/lunniy-svet-cover.jpg", 
                readUrl: "https://ru.hent.cool/comics/lunniy-svet/",
                tags: ["романтика", "драма"] 
            },
            { 
                id: 2, 
                title: "Воющие тени", 
                desc: "Битва в темноте с призраками", 
                img: "https://ru.hent.cool/wp-content/uploads/2024/05/voyushchie-teni-cover.jpg", 
                readUrl: "https://ru.hent.cool/comics/voyushchie-teni/",
                tags: ["экшн", "фэнтези", "ужасы"] 
            },
            { 
                id: 3, 
                title: "Школьные дни", 
                desc: "Повседневная жизнь учеников", 
                img: "https://ru.hent.cool/wp-content/uploads/2024/04/shkolnye-dni-cover.jpg", 
                readUrl: "https://ru.hent.cool/comics/shkolnye-dni/",
                tags: ["комедия", "школа", "повседневность"] 
            },
            { 
                id: 4, 
                title: "Космическая одиссея", 
                desc: "Путешествие к далёким звёздам", 
                img: "https://ru.hent.cool/wp-content/uploads/2024/03/kosmicheskaya-odisseya-cover.jpg", 
                readUrl: "https://ru.hent.cool/comics/kosmicheskaya-odisseya/",
                tags: ["фантастика", "приключения", "космос"] 
            },
            { 
                id: 5, 
                title: "Потерянные души", 
                desc: "Мистический детектив о призраках", 
                img: "https://ru.hent.cool/wp-content/uploads/2024/02/poteryannye-dushi-cover.jpg", 
                readUrl: "https://ru.hent.cool/comics/poteryannye-dushi/",
                tags: ["мистика", "детектив", "драма"] 
            },
            { 
                id: 6, 
                title: "Кулинарная магия", 
                desc: "Еда, которая меняет жизнь", 
                img: "https://ru.hent.cool/wp-content/uploads/2024/01/kulinarnaya-magiya-cover.jpg", 
                readUrl: "https://ru.hent.cool/comics/kulinarnaya-magiya/",
                tags: ["комедия", "фэнтези", "кулинария"] 
            },
            { 
                id: 7, 
                title: "Воспоминания будущего", 
                desc: "Путешествие во времени и любовь", 
                img: "https://ru.hent.cool/wp-content/uploads/2023/12/vospominaniya-budushchego-cover.jpg", 
                readUrl: "https://ru.hent.cool/comics/vospominaniya-budushchego/",
                tags: ["фантастика", "драма", "романтика"] 
            },
            { 
                id: 8, 
                title: "Легенда о мече", 
                desc: "Путь воина в фэнтезийном мире", 
                img: "https://ru.hent.cool/wp-content/uploads/2023/11/legenda-o-meche-cover.jpg", 
                readUrl: "https://ru.hent.cool/comics/legenda-o-meche/",
                tags: ["экшн", "фэнтези", "история"] 
            },
        ];

        let currentComicId = null;
        let likedHistory = JSON.parse(localStorage.getItem('likedHistory')) || [];
        let dislikedIds = JSON.parse(localStorage.getItem('dislikedIds')) || [];
        let viewedIds = JSON.parse(localStorage.getItem('viewedIds')) || [];

        // Загрузка случайного комикса
        function loadRandomComic() {
            const availableComics = comics.filter(c => !dislikedIds.includes(c.id));
            if (availableComics.length === 0) {
                document.getElementById('current-comic-img').src = '';
                document.getElementById('comic-title').textContent = 'Все комиксы просмотрены';
                document.getElementById('comic-desc').textContent = '';
                document.getElementById('comic-tags').textContent = '';
                document.getElementById('error-message').textContent = '';
                return;
            }
            const randomIndex = Math.floor(Math.random() * availableComics.length);
            const comic = availableComics[randomIndex];
            currentComicId = comic.id;
            document.getElementById('current-comic-img').src = comic.img;
            document.getElementById('comic-title').textContent = comic.title;
            document.getElementById('comic-desc').textContent = comic.desc;
            document.getElementById('comic-tags').textContent = `Теги: ${comic.tags.join(', ')}`;
            document.getElementById('error-message').textContent = '';
        }

        // Проверка доступности URL комикса
        async function checkComicUrl(url) {
            try {
                const response = await fetch(url, { method: 'HEAD', mode: 'no-cors' });
                return true; // Если запрос прошёл без CORS ошибки
            } catch (error) {
                // Если ошибка CORS, всё равно пробуем открыть (сайт может блокировать запросы)
                return true;
            }
        }

        // Оценка комикса
        function rateComic(type) {
            if (!currentComicId) return;
            if (type === 'like') {
                if (!likedHistory.find(c => c.id === currentComicId)) {
                    const comic = comics.find(c => c.id === currentComicId);
                    likedHistory.push(comic);
                    localStorage.setItem('likedHistory', JSON.stringify(likedHistory));
                }
            } else if (type === 'dislike') {
                if (!dislikedIds.includes(currentComicId)) {
                    dislikedIds.push(currentComicId);
                    localStorage.setItem('dislikedIds', JSON.stringify(dislikedIds));
                }
            }
            updateHistory();
            updateRecommendations();
            loadRandomComic();
        }

        // Чтение комикса (открывает реальную страницу на hent.cool)
        async function viewComic() {
            if (!currentComicId) return;
            const comic = comics.find(c => c.id === currentComicId);
            const errorEl = document.getElementById('error-message');
            
            // Проверяем доступность URL
            const isAvailable = await checkComicUrl(comic.readUrl);
            
            if (isAvailable) {
                window.open(comic.readUrl, '_blank');
                if (!viewedIds.includes(currentComicId)) {
                    viewedIds.push(currentComicId);
                    localStorage.setItem('viewedIds', JSON.stringify(viewedIds));
                }
                errorEl.textContent = '';
            } else {
                errorEl.textContent = '⚠️ Комикс временно недоступен. Попробуйте другой.';
                // Помечаем как недоступный
                if (!dislikedIds.includes(currentComicId)) {
                    dislikedIds.push(currentComicId);
                    localStorage.setItem('dislikedIds', JSON.stringify(dislikedIds));
                    loadRandomComic();
                }
            }
        }

        // Обновление истории лайков
        function updateHistory() {
            const container = document.getElementById('liked-comics');
            container.innerHTML = '';
            likedHistory.forEach(comic => {
                const item = document.createElement('div');
                item.className = 'comic-item';
                item.onclick = () => window.open(comic.readUrl, '_blank');
                item.innerHTML = `
                    <img src="${comic.img}" alt="${comic.title}" />
                    <p>${comic.title}</p>
                `;
                container.appendChild(item);
            });
        }

        // Обновление рекомендаций (на основе общих тегов)
        function updateRecommendations() {
            const likedTags = likedHistory.flatMap(c => c.tags);
            const tagCount = {};
            likedTags.forEach(tag => { tagCount[tag] = (tagCount[tag] || 0) + 1; });

            const recommended = comics
                .filter(c => !dislikedIds.includes(c.id) && !likedHistory.find(l => l.id === c.id))
                .map(c => ({
                    ...c,
                    score: c.tags.reduce((sum, tag) => sum + (tagCount[tag] || 0), 0)
                }))
                .sort((a, b) => b.score - a.score)
                .slice(0, 4);

            const container = document.getElementById('recommended-comics');
            container.innerHTML = '';
            recommended.forEach(comic => {
                const item = document.createElement('div');
                item.className = 'comic-item';
                item.onclick = () => window.open(comic.readUrl, '_blank');
                item.innerHTML = `
                    <img src="${comic.img}" alt="${comic.title}" />
                    <p>${comic.title}</p>
                `;
                container.appendChild(item);
            });
        }

        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            loadRandomComic();
            updateHistory();
            updateRecommendations();
        });
    </script>
</body>
</html>
