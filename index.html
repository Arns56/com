<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Случайные комиксы и манга</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background: #1a1a2e; color: #fff; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        header h1 { text-align: center; margin-bottom: 10px; color: #e94560; }
        header p { text-align: center; margin-bottom: 30px; color: #ccc; }
        .comic-display { display: flex; flex-direction: column; align-items: center; margin-bottom: 30px; }
        .comic-preview { width: 100%; max-width: 400px; border-radius: 10px; overflow: hidden; margin-bottom: 20px; border: 3px solid #0f3460; }
        .comic-preview img { width: 100%; height: 500px; object-fit: cover; display: block; }
        .comic-info { text-align: center; margin-bottom: 20px; max-width: 600px; }
        .buttons { display: flex; gap: 20px; margin-bottom: 20px; }
        button { padding: 12px 25px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .like { background: #4CAF50; color: white; }
        .dislike { background: #f44336; color: white; }
        .view { background: #2196F3; color: white; }
        .refresh { background: #9c27b0; color: white; }
        button:hover { opacity: 0.8; }
        .history, .recommended { background: #162447; padding: 20px; border-radius: 10px; margin-top: 30px; }
        h2 { margin-bottom: 15px; color: #e94560; border-bottom: 2px solid #e94560; padding-bottom: 5px; }
        .comic-list { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 15px; }
        .comic-item { background: #0f3460; border-radius: 8px; padding: 10px; width: 180px; text-align: center; cursor: pointer; transition: transform 0.3s; }
        .comic-item:hover { transform: scale(1.05); }
        .comic-item img { width: 100%; height: 250px; object-fit: cover; border-radius: 5px; }
        .comic-item p { margin-top: 8px; font-size: 14px; }
        .loading { text-align: center; font-size: 18px; margin: 20px; }
        .error { color: #f44336; text-align: center; margin: 10px 0; }
        .genre-tag { display: inline-block; background: #e94560; color: white; padding: 3px 8px; border-radius: 10px; font-size: 12px; margin: 2px; }
        @media (max-width: 768px) {
            .buttons { flex-direction: column; align-items: center; }
            button { width: 200px; }
            .comic-list { justify-content: center; }
            .comic-preview img { height: 350px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎴 Случайная манга и комиксы</h1>
            <p>Лайкайте, дизайкайте, читайте. Система учится на ваших оценках.</p>
            <button class="refresh" onclick="loadNewRandomManga()">🔄 Новая случайная манга</button>
        </header>

        <main>
            <div class="comic-display">
                <div class="comic-preview">
                    <img id="current-comic-img" src="" alt="Обложка манги" />
                </div>
                <div class="comic-info">
                    <h2 id="comic-title">Загрузка...</h2>
                    <p id="comic-desc"></p>
                    <div id="comic-tags"></div>
                    <p id="comic-info-text"></p>
                </div>
                <div class="buttons">
                    <button class="dislike" onclick="rateComic('dislike')">👎 Дизлайк</button>
                    <button class="view" onclick="viewComic()">📖 Читать онлайн</button>
                    <button class="like" onclick="rateComic('like')">👍 Лайк</button>
                </div>
                <div id="error-message" class="error"></div>
            </div>

            <div class="history">
                <h2>📚 История лайков</h2>
                <div id="liked-comics" class="comic-list">
                    <!-- Лайкнутые комиксы -->
                </div>
            </div>

            <div class="recommended">
                <h2>🔥 Рекомендуемые (по вашим лайкам)</h2>
                <div id="recommended-comics" class="comic-list">
                    <!-- Рекомендации -->
                </div>
            </div>
        </main>
    </div>

    <script>
        // Используем публичный API для манги (MangaDex API)
        const MANGADEX_API = 'https://api.mangadex.org';
        
        // Хранилище
        let allManga = [];
        let currentManga = null;
        let likedHistory = JSON.parse(localStorage.getItem('likedHistory')) || [];
        let dislikedIds = JSON.parse(localStorage.getItem('dislikedIds')) || [];

        // Загрузка случайной манги с MangaDex
        async function loadRandomManga() {
            try {
                document.getElementById('comic-title').textContent = 'Ищем случайную мангу...';
                document.getElementById('error-message').textContent = '';
                
                // Получаем случайную мангу
                const response = await fetch(`${MANGADEX_API}/manga/random?includes[]=cover_art&includes[]=author`);
                const mangaData = await response.json();
                
                if (mangaData.data) {
                    const manga = mangaData.data;
                    const attributes = manga.attributes;
                    
                    // Получаем обложку
                    let coverUrl = 'https://mangadex.org/img/avatar.png';
                    const coverRel = manga.relationships.find(r => r.type === 'cover_art');
                    if (coverRel && coverRel.attributes) {
                        const fileName = coverRel.attributes.fileName;
                        const mangaId = manga.id;
                        coverUrl = `https://uploads.mangadex.org/covers/${mangaId}/${fileName}.256.jpg`;
                    }
                    
                    // Формируем данные
                    currentManga = {
                        id: manga.id,
                        title: attributes.title.en || attributes.title.jp || attributes.title.ru || 'Без названия',
                        description: attributes.description.en || attributes.description.ru || 'Описание отсутствует',
                        year: attributes.year || 'Неизвестно',
                        status: attributes.status || 'ongoing',
                        tags: attributes.tags ? attributes.tags.map(tag => tag.attributes.name.en).slice(0, 5) : [],
                        cover: coverUrl,
                        readUrl: `https://mangadex.org/title/${manga.id}`,
                        externalUrl: attributes.links ? Object.values(attributes.links)[0] : null
                    };
                    
                    // Отображаем
                    displayCurrentManga();
                }
            } catch (error) {
                console.error('Ошибка загрузки манги:', error);
                document.getElementById('error-message').textContent = 'Не удалось загрузить мангу. Попробуйте еще раз.';
                // Используем fallback
                loadFallbackManga();
            }
        }

        // Fallback манга (если API не работает)
        function loadFallbackManga() {
            const fallbackManga = [
                {
                    id: 'naruto',
                    title: 'Наруто',
                    description: 'История ниндзя Наруто Узумаки',
                    year: '1999',
                    status: 'completed',
                    tags: ['экшен', 'приключения', 'комедия'],
                    cover: 'https://mangadex.org/covers/32f7f4d5-ccd1-4f71-a7c6-21c2e0c8b45a/05f5791e-0bfc-42a6-920d-bb7a0aa3b8e7.jpg',
                    readUrl: 'https://mangadex.org/title/32f7f4d5-ccd1-4f71-a7c6-21c2e0c8b45a/naruto'
                },
                {
                    id: 'onepiece',
                    title: 'Ван Пис',
                    description: 'Приключения пирата Луффи',
                    year: '1997',
                    status: 'ongoing',
                    tags: ['экшен', 'приключения', 'комедия', 'фэнтези'],
                    cover: 'https://mangadex.org/covers/5f5f63c9-35d2-4be5-9f6a-8e5b6e5b5e5b/cover.jpg',
                    readUrl: 'https://mangadex.org/title/5f5f63c9-35d2-4be5-9f6a-8e5b6e5b5e5b/one-piece'
                },
                {
                    id: 'berserk',
                    title: 'Берсерк',
                    description: 'Мрачное фэнтези о воине Гатсе',
                    year: '1989',
                    status: 'ongoing',
                    tags: ['фэнтези', 'ужасы', 'драма'],
                    cover: 'https://mangadex.org/covers/a1b2c3d4-e5f6-7890-abcd-ef1234567890/cover.jpg',
                    readUrl: 'https://mangadex.org/title/a1b2c3d4-e5f6-7890-abcd-ef1234567890/berserk'
                }
            ];
            
            const randomManga = fallbackManga[Math.floor(Math.random() * fallbackManga.length)];
            currentManga = randomManga;
            displayCurrentManga();
        }

        // Отображение текущей манги
        function displayCurrentManga() {
            if (!currentManga) return;
            
            document.getElementById('current-comic-img').src = currentManga.cover;
            document.getElementById('comic-title').textContent = currentManga.title;
            document.getElementById('comic-desc').textContent = currentManga.description.length > 200 
                ? currentManga.description.substring(0, 200) + '...' 
                : currentManga.description;
            
            const tagsContainer = document.getElementById('comic-tags');
            tagsContainer.innerHTML = '';
            currentManga.tags.forEach(tag => {
                const tagEl = document.createElement('span');
                tagEl.className = 'genre-tag';
                tagEl.textContent = tag;
                tagsContainer.appendChild(tagEl);
            });
            
            document.getElementById('comic-info-text').textContent = 
                `Год: ${currentManga.year} | Статус: ${currentManga.status === 'ongoing' ? 'Выпускается' : 'Завершена'}`;
        }

        // Оценка манги
        function rateComic(type) {
            if (!currentManga) return;
            
            if (type === 'like') {
                if (!likedHistory.find(m => m.id === currentManga.id)) {
                    likedHistory.push(currentManga);
                    localStorage.setItem('likedHistory', JSON.stringify(likedHistory));
                }
            } else if (type === 'dislike') {
                if (!dislikedIds.includes(currentManga.id)) {
                    dislikedIds.push(currentManga.id);
                    localStorage.setItem('dislikedIds', JSON.stringify(dislikedIds));
                }
            }
            
            updateHistory();
            updateRecommendations();
            loadRandomManga();
        }

        // Чтение манги
        function viewComic() {
            if (!currentManga) return;
            
            if (currentManga.readUrl) {
                window.open(currentManga.readUrl, '_blank');
            } else if (currentManga.externalUrl) {
                window.open(currentManga.externalUrl, '_blank');
            } else {
                document.getElementById('error-message').textContent = 'Ссылка для чтения недоступна';
            }
        }

        // Обновление истории лайков
        function updateHistory() {
            const container = document.getElementById('liked-comics');
            container.innerHTML = '';
            
            likedHistory.slice(-6).forEach(manga => {
                const item = document.createElement('div');
                item.className = 'comic-item';
                item.onclick = () => window.open(manga.readUrl, '_blank');
                item.innerHTML = `
                    <img src="${manga.cover}" alt="${manga.title}" />
                    <p>${manga.title}</p>
                `;
                container.appendChild(item);
            });
        }

        // Рекомендации (упрощенные - похожие по тегам)
        async function updateRecommendations() {
            if (likedHistory.length === 0) {
                document.getElementById('recommended-comics').innerHTML = '<p>Лайкните несколько манг для рекомендаций</p>';
                return;
            }
            
            try {
                // Получаем рекомендации на основе тегов
                const allTags = likedHistory.flatMap(m => m.tags);
                const popularTag = allTags.reduce((acc, tag) => {
                    acc[tag] = (acc[tag] || 0) + 1;
                    return acc;
                }, {});
                
                const mostPopularTag = Object.keys(popularTag).sort((a, b) => popularTag[b] - popularTag[a])[0];
                
                // Ищем мангу с таким же тегом
                const response = await fetch(`${MANGADEX_API}/manga?limit=4&includedTags[]=${mostPopularTag}&order[followedCount]=desc`);
                const data = await response.json();
                
                const container = document.getElementById('recommended-comics');
                container.innerHTML = '';
                
                if (data.data && data.data.length > 0) {
                    data.data.slice(0, 4).forEach(manga => {
                        const attributes = manga.attributes;
                        let coverUrl = 'https://mangadex.org/img/avatar.png';
                        const coverRel = manga.relationships.find(r => r.type === 'cover_art');
                        
                        if (coverRel && coverRel.attributes) {
                            const fileName = coverRel.attributes.fileName;
                            coverUrl = `https://uploads.mangadex.org/covers/${manga.id}/${fileName}.256.jpg`;
                        }
                        
                        const item = document.createElement('div');
                        item.className = 'comic-item';
                        item.onclick = () => window.open(`https://mangadex.org/title/${manga.id}`, '_blank');
                        item.innerHTML = `
                            <img src="${coverUrl}" alt="${attributes.title.en || 'Манга'}" />
                            <p>${attributes.title.en || 'Манга'}</p>
                        `;
                        container.appendChild(item);
                    });
                }
            } catch (error) {
                console.error('Ошибка загрузки рекомендаций:', error);
            }
        }

        // Новая случайная манга
        function loadNewRandomManga() {
            loadRandomManga();
        }

        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            loadRandomManga();
            updateHistory();
            updateRecommendations();
        });
    </script>
</body>
</html>
